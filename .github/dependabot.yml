version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-patch-backend:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "uv"
    directory: "/ml-service"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-patch-ml-service:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch-root:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch-frontend:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch-root:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch-backend:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/ml-service"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch-ml-service:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch-frontend:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directory: "/infra"
    schedule:
      interval: "weekly"
    groups:
      docker-compose-minor-patch-infra:
        update-types:
          - "minor"
          - "patch"
