[project]
name = "trendgap-ml"
version = "0.0.1"
description = "TrendGap ML service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendgap_ml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
