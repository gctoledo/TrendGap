spring:
  application:
    name: trendgap
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${trendgap.db.url:}
    username: ${trendgap.db.username:}
    password: ${trendgap.db.password:}
    hikari:
      connection-timeout: 2000

server:
  port: ${trendgap.http.port:8080}

management:
  server:
    port: ${trendgap.management.port:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
