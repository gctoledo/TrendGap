# Scrape config for the local LGTM stack (profile "observability").
# Mounted over the image's Prometheus config; targets live on the internal network only.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]
